---
format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android
app:
  envs:
  - MODULE: app
  - VARIANT: Release
  - APP_PACKAGE_NAME: pm.bam.gamedeals
trigger_map:
- tag: v*.*.*
  pipeline: release
pipelines:
  release:
    summary: Ship a v*.*.* tag to both stores — Play internal and TestFlight, in parallel.
    workflows:
      release-android: {}
      release-ios: {}
step_bundles:
  derive-version:
    summary: VERSION_NAME / VERSION_CODE from the pushed v*.*.* tag (Play versionCode = iOS CFBundleVersion).
    steps:
    - script@1:
        title: Derive version from tag
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            # $BITRISE_GIT_TAG is the pushed tag, e.g. "v1.0.7".
            TAG="${BITRISE_GIT_TAG:?missing BITRISE_GIT_TAG}"
            VERSION_NAME="${TAG#v}"

            # Guard: require a strictly numeric MAJOR.MINOR.PATCH tag. A pre-release suffix
            # (v1.0.7-rc1) or a two-part tag (v1.2) would otherwise yield a wrong versionCode
            # or a cryptic arithmetic error — fail fast with a clear message instead.
            if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: tag '$TAG' must be vMAJOR.MINOR.PATCH, all numeric (e.g. v1.0.7)." >&2
              exit 1
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
            # minor/patch must each be < 100 to keep the code scheme strictly increasing.
            if (( 10#$MINOR > 99 || 10#$PATCH > 99 )); then
              echo "ERROR: tag '$TAG' minor/patch must each be < 100 (versionCode scheme limit)." >&2
              exit 1
            fi

            # Deterministic, strictly-increasing code from the tag.
            VERSION_CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))
            echo "VERSION_NAME=$VERSION_NAME  VERSION_CODE=$VERSION_CODE"
            envman add --key VERSION_NAME --value "$VERSION_NAME"
            envman add --key VERSION_CODE --value "$VERSION_CODE"
workflows:
  release-android:
    summary: Build a signed release AAB from a v*.*.* tag and ship it to the Play
      Store internal track.
    description: |
      Triggered by pushing a tag like `v1.0.7`. Derives the version from the tag, builds a
      signed AAB (signing config in app/build.gradle.kts reads RELEASE_* env vars + the keystore
      at the repo root), uploads to the Play Store `internal` track with the R8 mapping + release
      notes, and archives the AAB/mapping as Bitrise build artifacts.
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - bundle::derive-version: {}
    - script@1:
        title: Run unit tests
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # NOTE: no `set -e` around gradle — we must export the JUnit XMLs even when tests
            # fail, then exit with gradle's status so a failure still aborts the release.
            set -uo pipefail
            ./gradlew --no-daemon testDebugUnitTest testAndroidHostTest
            status=$?

            # Surface results in the Bitrise Test Reports tab (which test failed), even on failure.
            if [[ -n "${BITRISE_TEST_RESULT_DIR:-}" ]]; then
              dest="$BITRISE_TEST_RESULT_DIR/unit-tests"
              mkdir -p "$dest"
              # Flatten with path-encoded names so same-named XMLs across modules don't collide.
              find . -path '*/build/test-results/*' -name '*.xml' -print0 \
                | while IFS= read -r -d '' f; do cp "$f" "$dest/$(echo "${f#./}" | tr '/' '_')"; done
              printf '{"test-name":"Unit tests"}' > "$dest/test-info.json"
            fi
            exit $status
    - script@1:
        title: Place upload keystore at repo root
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            # $BITRISEIO_ANDROID_KEYSTORE_URL is published by the Bitrise Code Signing tab.
            # app/build.gradle.kts expects the keystore at ../upload_keystore.jks (repo root).
            curl -fsSL "$BITRISEIO_ANDROID_KEYSTORE_URL" -o "$BITRISE_SOURCE_DIR/upload_keystore.jks"
    - android-build@1:
        title: Build release AAB
        inputs:
        - project_location: "$BITRISE_SOURCE_DIR"
        - module: "$MODULE"
        - variant: "$VARIANT"
        - build_type: aab
    - google-play-deploy@3:
        title: Deploy to Play Store (internal)
        inputs:
        - service_account_json_key_path: "$BITRISEIO_SERVICE_ACCOUNT_JSON_KEY_URL"
        - package_name: "$APP_PACKAGE_NAME"
        - app_path: "$BITRISE_AAB_PATH"
        - track: internal
        - status: completed
        - mapping_file: "$BITRISE_MAPPING_PATH"
        - whatsnews_dir: "$BITRISE_SOURCE_DIR/whatsnew"
    - deploy-to-bitrise-io@2: {}
    meta:
      bitrise.io:
        stack: ubuntu-resolute-26.04-bitrise-2026-android
        machine_type_id: standard
  release-ios:
    summary: Build a signed App Store IPA from a v*.*.* tag and upload it to TestFlight.
    description: |
      Runs alongside release-android in the `release` pipeline. Same tag-derived version
      (MARKETING_VERSION = VERSION_NAME, CURRENT_PROJECT_VERSION = VERSION_CODE). Signing uses the
      project's Apple service connection (App Store Connect team API key, Admin role) plus the Apple
      Distribution certificate uploaded on the Code Signing tab; xcode-archive fetches/creates the App
      Store provisioning profile. The shared Kotlin framework is built by the Xcode "Compile Kotlin
      Framework" phase (Gradle) — hence the JDK step. No caches (see docs/ci-cd.md §6), so each run
      downloads the Kotlin/Native toolchain cold.
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - bundle::derive-version: {}
    - set-java-version@1:
        inputs:
        - set_java_version: '21'
    - script@1:
        title: Write Secrets.xcconfig
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            # The Xcode project bases both configurations on iosApp/Secrets.xcconfig (gitignored);
            # Info.plist reads these values at build time. Same secrets as the Android build.
            # SENTRY_DSN_IOS, if set, points iOS at its own Sentry project.
            dsn="${SENTRY_DSN_IOS:-${SENTRY_DSN:-}}"
            # xcconfig treats `//` as a comment start — rebuild the scheme's `//` from $(SLASH).
            dsn="${dsn//\/\//\$(SLASH)\$(SLASH)}"
            cat > "$BITRISE_SOURCE_DIR/iosApp/Secrets.xcconfig" <<EOF
            SLASH = /
            IGDB_CLIENT_ID = ${IGDB_CLIENT_ID:?missing IGDB_CLIENT_ID}
            IGDB_CLIENT_SECRET = ${IGDB_CLIENT_SECRET:?missing IGDB_CLIENT_SECRET}
            ITAD_API_KEY = ${ITAD_API_KEY:?missing ITAD_API_KEY}
            ITAD_OAUTH_CLIENT_ID = ${ITAD_OAUTH_CLIENT_ID:?missing ITAD_OAUTH_CLIENT_ID}
            SENTRY_DSN = ${dsn}
            EOF
    - script@1:
        title: Install sentry-cli (dSYM upload)
        run_if: '{{getenv "SENTRY_AUTH_TOKEN" | ne ""}}'
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            # The Xcode "Upload dSYMs to Sentry" phase no-ops unless sentry-cli is on PATH and
            # SENTRY_AUTH_TOKEN is set; it reads SENTRY_ORG / SENTRY_PROJECT from env.
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://sentry.io/get-cli/ | INSTALL_DIR="$HOME/.local/bin" sh
            envman add --key PATH --value "$HOME/.local/bin:$PATH"
            if [[ -n "${SENTRY_PROJECT_IOS:-}" ]]; then
              envman add --key SENTRY_PROJECT --value "$SENTRY_PROJECT_IOS"
            fi
    - xcode-archive@6:
        title: Archive + export App Store IPA
        inputs:
        - project_path: "$BITRISE_SOURCE_DIR/iosApp/iosApp.xcodeproj"
        - scheme: iosApp
        - configuration: Release
        - distribution_method: app-store
        - automatic_code_signing: api-key
        - xcconfig_content: |-
            COMPILER_INDEX_STORE_ENABLE = NO
            MARKETING_VERSION = $VERSION_NAME
            CURRENT_PROJECT_VERSION = $VERSION_CODE
    - deploy-to-itunesconnect-application-loader@2:
        title: Upload to App Store Connect (TestFlight)
        inputs:
        - connection: api_key
        - ipa_path: "$BITRISE_IPA_PATH"
        - platform: ios
        # App Store Connect Apple ID of the app. v2 uses `altool --upload-package` with it, which
        # avoids Xcode 26 builds that upload fine but never appear in App Store Connect.
        - app_id: '6818586859'
    - deploy-to-bitrise-io@2: {}
    meta:
      bitrise.io:
        stack: osx-xcode-26.6.x
        machine_type_id: g2.mac.medium
  promote-production:
    summary: Promote a release already on the Play internal track to production (10%
      staged rollout).
    description: |
      Manual workflow. Production must receive the SAME artifact (identical versionCode + binary)
      that was vetted on internal — never a rebuild, because a rebuilt AAB is a different binary and
      Play rejects a duplicate versionCode.

      Set $PROMOTE_BUILD_SLUG to the `release-android` build being promoted (the last path segment of
      its Bitrise build URL). The fetch step pulls that build's archived AAB over the Bitrise API and
      checks out the tag it was built from, so the Play release notes match the binary. No mapping is
      re-uploaded — see the comment on the deploy step below. Requires a Bitrise personal access
      token in Secrets as $BITRISE_API_TOKEN.

      Simplest path remains the Play Console "Promote release" button (Internal -> Production) with
      the staged-rollout %; this workflow is the CLI equivalent.
    steps:
    - git-clone@8: {}
    - script@1:
        title: Fetch the promoted build's AAB
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail

            : "${PROMOTE_BUILD_SLUG:?set PROMOTE_BUILD_SLUG to the release-android build being promoted (last path segment of its build URL)}"
            : "${BITRISE_API_TOKEN:?add a Bitrise personal access token to Secrets as BITRISE_API_TOKEN}"

            api="https://api.bitrise.io/v0.1/apps/$BITRISE_APP_SLUG"
            auth=(-H "Authorization: $BITRISE_API_TOKEN")

            # Refuse anything but a green build: a failed run can still have archived artifacts, and
            # those are precisely the ones that never passed internal QA.
            build=$(curl -fsSL "${auth[@]}" "$api/builds/$PROMOTE_BUILD_SLUG")
            status=$(printf '%s' "$build" | jq -r '.data.status_text')
            tag=$(printf '%s' "$build" | jq -r '.data.tag // empty')
            if [[ "$status" != "success" ]]; then
              echo "ERROR: build $PROMOTE_BUILD_SLUG is '$status', not 'success' — refusing to promote." >&2
              exit 1
            fi
            echo "Promoting build $PROMOTE_BUILD_SLUG (tag: ${tag:-none})"

            artifacts=$(curl -fsSL "${auth[@]}" "$api/builds/$PROMOTE_BUILD_SLUG/artifacts")
            dest="$BITRISE_SOURCE_DIR/promote-artifacts"
            mkdir -p "$dest"

            # $1 = regex matching the artifact title, $2 = local filename to save it as.
            fetch() {
              local slug url
              slug=$(printf '%s' "$artifacts" | jq -r --arg p "$1" 'first(.data[] | select(.title | test($p)) | .slug) // empty')
              if [[ -z "$slug" ]]; then
                echo "ERROR: build $PROMOTE_BUILD_SLUG has no artifact matching /$1/." >&2
                exit 1
              fi
              url=$(curl -fsSL "${auth[@]}" "$api/builds/$PROMOTE_BUILD_SLUG/artifacts/$slug" | jq -r '.data.expiring_download_url')
              curl -fsSL "$url" -o "$dest/$2"
              [[ -s "$dest/$2" ]] || { echo "ERROR: downloaded $2 is empty." >&2; exit 1; }
            }

            fetch '\.aab$' app-release.aab

            # git-clone has no tag to check out on a manually started build, so it lands on the
            # default branch. Move to the promoted tag or Play gets whatever whatsnew/ says today
            # rather than the notes that shipped with this binary.
            if [[ -n "$tag" ]]; then
              git -C "$BITRISE_SOURCE_DIR" fetch --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
              git -C "$BITRISE_SOURCE_DIR" checkout -q "refs/tags/$tag"
            fi

            envman add --key PROMOTE_AAB_PATH --value "$dest/app-release.aab"
    - google-play-deploy@3:
        title: Deploy to Play Store (production, 10% staged)
        inputs:
        - service_account_json_key_path: "$BITRISEIO_SERVICE_ACCOUNT_JSON_KEY_URL"
        - package_name: "$APP_PACKAGE_NAME"
        - app_path: "$PROMOTE_AAB_PATH"
        - track: production
        - status: inProgress
        - user_fraction: '0.1'
        # No mapping_file on purpose: Play already holds the R8 mapping bound to this bundle's
        # versionCode from the internal upload, so re-uploading it here is redundant. It is also
        # actively risky — release-android archives two mapping files (only the timestamped one is
        # the $BITRISE_MAPPING_PATH that was actually deployed), and they share a pg_map_id, so
        # picking the wrong one uploads cleanly and quietly breaks production deobfuscation.
        - whatsnews_dir: "$BITRISE_SOURCE_DIR/whatsnew"
    meta:
      bitrise.io:
        stack: ubuntu-resolute-26.04-bitrise-2026-android
        machine_type_id: standard
