# https://gamedeals.bam.pm/, the App Store support URL. See store/README.md.
name = "gamedeals-site"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "gamedeals.bam.pm", custom_domain = true }]
# index.html is imported as a string, so the page stays plain HTML.
rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]
# Keep request logs off: the privacy policy says we do not keep a log of event-file requests.
[observability]
enabled = false
# Per-game public signals (signals-routes.mjs). Create once with `npx wrangler@4 d1 create gamedeals-signals`, put
# its id here, then apply migrations/ (see README). Holds public game data only, never anything about users.
[[d1_databases]]
binding = "SIGNALS_DB"
database_name = "gamedeals-signals"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
# The app's remote feature switches (flags-routes.mjs). Create once with `npx wrangler@4 kv namespace create
# gamedeals-flags`, put its id here, then store flags.json as the key `flags` (see README). Public settings only.
[[kv_namespaces]]
binding = "FLAGS"
id = "00000000000000000000000000000000"
